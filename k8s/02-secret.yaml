# The database password and connection string.
#
# Kept separate from the ConfigMap so the credential exists in exactly one
# place. PostgreSQL reads POSTGRES_PASSWORD from here, and ingestion and
# dashboard read DATABASE_URL, so no manifest and no source file contains the
# password directly.
#
# A Secret is base64 encoded, not encrypted. It keeps the value out of the
# ConfigMap and out of the application code, which is the point, but it is not
# protection against someone who can already read the cluster. A real
# deployment would use an external secret store.
#
# stringData is used instead of data so the values can be written in plain
# text; Kubernetes encodes them when the object is created.
kind: Secret
apiVersion: v1
metadata:
  name: farm-secret
  namespace: smart-farm
type: Opaque
stringData:
  POSTGRES_PASSWORD: "farm"
  DATABASE_URL: "postgresql://farm:farm@postgres:5432/farmdb"