<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGT307_Smart IOT Plant Monitoring System</title>
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --line:#CED8D2;
  --ink:#202823; --ink-dim:#4F5E55; --ink-faint:#718078;
  --optimal:#2E7D32; --warning:#D88900; --critical:#D13D3D; --pending:#607D8B;
  --ui:Arial,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
     font-size:16px;line-height:1.45}
header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
       padding:18px 28px;background:#2E7D32;color:#fff;border-bottom:4px solid #245F28}
h1{font-size:23px;font-weight:600;margin:0}
.counters{display:flex;gap:26px;flex-wrap:wrap}
.counter b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.counter span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.tick{margin-left:auto;font-size:13px;opacity:.9}
main{padding:24px 28px;max-width:1280px;margin:0 auto}
section{margin-bottom:30px}
h2{font-size:15px;font-weight:700;color:var(--ink-dim);margin:0 0 12px;
   padding-bottom:7px;border-bottom:2px solid var(--line)}

.alert{display:flex;gap:14px;align-items:center;padding:13px 16px;background:var(--surface);
       border-left:5px solid var(--warning);border-radius:3px;margin-bottom:8px;
       box-shadow:0 1px 2px rgba(0,0,0,.06)}
.alert.Critical{border-left-color:var(--critical)}
.alert .zone{font-weight:700;min-width:86px}
.alert .cause{flex:1}
.alert .when{font-size:13px;color:var(--ink-faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:4px;
      padding:15px 17px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.zone-top{display:flex;justify-content:space-between;align-items:baseline}
.zone-id{font-size:17px;font-weight:700}
.state{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.Optimal .state{color:var(--optimal)} .Warning .state{color:var(--warning)}
.Critical .state{color:var(--critical)} .pending .state{color:var(--pending)}
.zone-sub{font-size:12px;color:var(--ink-faint);margin:2px 0 12px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.row span{color:var(--ink-dim)}
.row b{font-weight:600}
.zone-cause{margin-top:10px;font-size:13px;color:var(--critical)}
.zone-when{margin-top:8px;font-size:12px;color:var(--ink-faint)}

table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
   color:var(--ink-faint);padding:9px 12px;border-bottom:2px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink-dim)}
td.Critical{color:var(--critical);font-weight:600}
td.Warning{color:var(--warning);font-weight:600}

.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.legend{display:flex;gap:20px;font-size:12px;color:var(--ink-faint);margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
svg{display:block;width:100%;height:auto}
select{font-family:var(--ui);font-size:14px;padding:3px 7px;
       border:1px solid var(--line);border-radius:3px;margin-left:10px}
.empty{color:var(--ink-faint);font-size:14px;padding:10px 0}
footer{padding:16px 28px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint)}
</style>
</head>
<body>
<header>
  <h1>EGT307_Smart IOT Plant Monitoring System</h1>
  <div class="counters" id="counters"></div>
  <div class="tick" id="tick">connecting</div>
</header>

<main>
  <section><h2>Active alerts</h2><div id="alerts"><p class="empty">Loading</p></div></section>
  <section><h2>Grow zones</h2><div class="grid" id="grid"><p class="empty">Loading</p></div></section>
  <section>
    <h2>Zone trend <select id="pick"></select></h2>
    <div id="trend"><p class="empty">Loading</p></div>
  </section>
  <section><h2>Alert history</h2><div id="history"><p class="empty">Loading</p></div></section>
</main>

<footer id="footer"></footer>

<script>
// Which sensors to show on each zone card, and how to label them.
const SHOW = [
  ["temperature",   "Temperature", "\u00B0C", 1],
  ["soil_moisture", "Soil moisture", "%", 1],
  ["soil_humidity", "Soil humidity", "%", 1],
  ["air_humidity",  "Air humidity", "%", 1],
  ["ph",            "Soil pH", "", 2],
  ["soil_ec",       "Soil EC", "", 2],
  ["light_intensity","Light", " lx", 0]
];

let GATEWAY = "http://localhost:8080";

async function get(path){
  const res = await fetch(GATEWAY + path);
  if(!res.ok) throw new Error(path);
  return res.json();
}
function ago(iso){
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + " min ago";
  return Math.round(mins/60) + " h ago";
}

function showZones(zones){
  const el = document.getElementById("grid");
  if(!zones.length){ el.innerHTML = '<p class="empty">No readings yet.</p>'; return; }
  el.innerHTML = zones.map(z => `
    <div class="zone ${z.label}">
      <div class="zone-top"><span class="zone-id">${z.zone_id}</span>
        <span class="state">${z.label}</span></div>
      <div class="zone-sub">${z.soil_type || ""}</div>
      ${SHOW.map(([key,name,unit,dp]) => z[key] == null ? "" :
        `<div class="row"><span>${name}</span><b>${z[key].toFixed(dp)}${unit}</b></div>`).join("")}
      ${z.probable_cause ? `<div class="zone-cause">${z.probable_cause}</div>` : ""}
      <div class="zone-when">Updated ${ago(z.recorded_at)}</div>
    </div>`).join("");
}

function showAlerts(list){
  const el = document.getElementById("alerts");
  if(!list.length){ el.innerHTML = '<p class="empty">All zones are healthy.</p>'; return; }
  el.innerHTML = list.map(i => `
    <div class="alert ${i.severity}">
      <span class="zone">${i.zone_id}</span>
      <span class="cause">${i.probable_cause}</span>
      <span class="when">${ago(i.opened_at)}</span>
    </div>`).join("");
}

function showHistory(list){
  const el = document.getElementById("history");
  if(!list.length){ el.innerHTML = '<p class="empty">No alerts recorded.</p>'; return; }
  el.innerHTML = `<table><tr><th>Zone</th><th>Severity</th><th>Probable cause</th>
    <th>Opened</th><th>Status</th></tr>` + list.slice(0,12).map(i => `
    <tr><td>${i.zone_id}</td><td class="${i.severity}">${i.severity}</td>
    <td>${i.probable_cause}</td><td>${new Date(i.opened_at).toLocaleString()}</td>
    <td>${i.status}</td></tr>`).join("") + `</table>`;
}

function showCounters(open, stats){
  const crit = open.filter(i => i.severity === "Critical").length;
  const warn = open.filter(i => i.severity === "Warning").length;
  document.getElementById("counters").innerHTML = `
    <div class="counter"><b>${crit}</b><span>Critical</span></div>
    <div class="counter"><b>${warn}</b><span>Warning</span></div>
    <div class="counter"><b>${Number(stats.readings).toLocaleString()}</b><span>Readings</span></div>`;
}

// Trend chart, drawn as plain SVG. Shows soil moisture and temperature over the
// last 60 readings, with the periods the model flagged shaded in red.
async function showTrend(){
  const zone = document.getElementById("pick").value;
  const el = document.getElementById("trend");
  if(!zone){ el.innerHTML = '<p class="empty">No zones yet.</p>'; return; }

  let rows;
  try { rows = (await get(`/api/readings?zone_id=${zone}&limit=60`)).readings; }
  catch(e){ el.innerHTML = '<p class="empty">No readings for this zone.</p>'; return; }
  if(rows.length < 2){ el.innerHTML = '<p class="empty">Not enough readings yet.</p>'; return; }

  rows = rows.slice().reverse();                    // oldest first
  const W = 900, H = 210, P = 30;
  const x = i => P + (i / (rows.length - 1)) * (W - 2*P);

  const line = (key, colour) => {
    const vals = rows.map(r => r[key]);
    const ok = vals.filter(v => v != null);
    if(!ok.length) return "";
    const lo = Math.min(...ok), hi = Math.max(...ok), pad = (hi-lo)*0.2 || 1;
    const y = v => P + (H-2*P) - ((v-(lo-pad)) / ((hi+pad)-(lo-pad))) * (H-2*P);
    let d = "", pen = false;
    vals.forEach((v,i) => { if(v==null){ pen=false; return; }
      d += (pen?"L":"M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; pen=true; });
    return `<path d="${d}" fill="none" stroke="${colour}" stroke-width="2"/>`;
  };

  // Shade the stretches where the model said the zone was not Optimal.
  const bands = []; let start = null;
  rows.forEach((r,i) => {
    const bad = r.label === "Warning" || r.label === "Critical";
    if(bad && start === null) start = i;
    if(!bad && start !== null){ bands.push([start, i-1]); start = null; }
  });
  if(start !== null) bands.push([start, rows.length-1]);

  el.innerHTML = `<div class="chart-box">
    <div class="legend">
      <span><i style="background:#2E7D32"></i>Soil moisture %</span>
      <span><i style="background:#D88900"></i>Temperature \u00B0C</span>
      <span><i style="background:#D13D3D;opacity:.3"></i>Flagged by the model</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}">
      ${bands.map(([a,b]) => `<rect x="${x(a)}" y="${P}"
         width="${Math.max(x(b)-x(a),3)}" height="${H-2*P}" fill="#D13D3D" opacity="0.15"/>`).join("")}
      ${line("soil_moisture", "#2E7D32")}
      ${line("temperature", "#D88900")}
      <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="#CED8D2"/>
      <text x="${P}" y="${H-8}" font-size="12" fill="#718078">60 readings ago</text>
      <text x="${W-P}" y="${H-8}" font-size="12" fill="#718078" text-anchor="end">now</text>
    </svg></div>`;
}

async function refresh(){
  try{
    const [zones, open, all, stats] = await Promise.all([
      get("/api/zones"), get("/api/incidents?status=open"),
      get("/api/incidents"), get("/api/stats")]);
    showZones(zones.zones); showAlerts(open.incidents);
    showHistory(all.incidents); showCounters(open.incidents, stats);

    const pick = document.getElementById("pick");
    const ids = zones.zones.map(z => z.zone_id);
    if(pick.options.length !== ids.length){
      const keep = pick.value;
      pick.innerHTML = ids.map(id => `<option>${id}</option>`).join("");
      pick.value = ids.includes(keep) ? keep : (ids[0] || "");
      if(!pick.dataset.ready){ pick.onchange = showTrend; pick.dataset.ready = "1"; }
    }
    await showTrend();
    document.getElementById("tick").textContent = "Updated " + new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById("tick").textContent = "Cannot reach the gateway";
  }
}

async function showFooter(){
  try{
    const [health, model] = await Promise.all([get("/health/all"), get("/api/model")]);
    const up = Object.entries(health.services)
      .map(([n,s]) => `${n}: ${s}`).join("  |  ");
    document.getElementById("footer").textContent =
      `${up}  |  Model ${model.version}  |  Critical recall ${model.critical_recall}`;
  }catch(e){}
}

(async function(){
  try{ GATEWAY = (await (await fetch("/config.json")).json()).gatewayUrl; }catch(e){}
  await refresh(); await showFooter();
  setInterval(refresh, 10000);
  setInterval(showFooter, 30000);
})();
</script>
</body>
</html>
